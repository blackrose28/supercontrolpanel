[package]
name = "super-control-panel"
version = "1.2.7"
description = "Cross-platform PTY-driven control panel for OpenVPN, Boundary, SSH, and SCP workflows"
edition = "2021"
default-run = "super-control-panel"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Platform features required — without them keyring uses an in-memory mock per Entry,
# so set_password "succeeds" but the next get_password always misses (see keyring docs).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
totp-rs = "5"
httpdate = "1"
uuid = { version = "1", features = ["v4"] }

# CC (Control Plane) dependencies
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
chrono = "0.4"
rand = "0.8"
flate2 = "1"
regex = "1"
aes-gcm = "0.10"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
