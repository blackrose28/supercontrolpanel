name: Standalone CLI and Desktop CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  standalone-cli:
    name: Standalone CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check workspace formatting
        run: cargo fmt --check

      - name: Run Clippy on standalone workspace crates
        run: cargo clippy --locked -p scp-core -p scp-mcp -p scp-cli --all-targets --all-features -- -D warnings

      - name: Run standalone workspace tests
        run: cargo test --locked -p scp-core -p scp-mcp -p scp-cli

      - name: Build release scpctl without GUI libraries
        run: cargo build --locked --release -p scp-cli

      - name: Package and verify scpctl release artifact
        shell: bash
        run: |
          node scripts/package-scpctl.mjs --out-dir dist-cli
          node scripts/package-scpctl.mjs --verify dist-cli

      - name: Verify POSIX prefix install smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="$(ls dist-cli/scpctl-*.tar.gz)"
          tmp_prefix="$(mktemp -d)"
          trap 'rm -rf "$tmp_prefix"' EXIT
          bash scripts/install-scpctl.sh --archive "$archive" --checksums dist-cli/SHA256SUMS --prefix "$tmp_prefix"
          SCPCTL_CONFIG_DIR=/nonexistent/ci-smoke "$tmp_prefix/bin/scpctl" capabilities --no-profile --json

      - name: Run Linux GUI-free stdio MCP & release qualification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --release -p scp-core --example sshd_fixture_daemon
          npm ci --ignore-scripts --prefix experiments/cli-stdio-slice0
          SCPCTL_BIN="target/release/scpctl" \
          SSHD_FIXTURE_BIN="target/release/examples/sshd_fixture_daemon" \
            node --test \
              experiments/cli-stdio-slice0/tests/slice1_production_stdio.mjs \
              experiments/cli-stdio-slice0/tests/slice4_production_stdio.mjs \
              experiments/cli-stdio-slice0/tests/slice5_release_qualification.mjs

      - name: Upload standalone CLI release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scpctl-${{ runner.os }}
          path: dist-cli/

  desktop-regression:
    name: Desktop Tauri Regression (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend and test desktop Rust backend
        run: |
          npm ci
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Playwright desktop regression tests
        run: |
          npx playwright install chromium
          npx playwright test --project=chromium
