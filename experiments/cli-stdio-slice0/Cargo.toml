[package]
name = "scp-cli-stdio-slice0"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["base64", "macros", "server", "transport-io"] }
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
portable-pty = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4", features = ["crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[workspace]
