[package]
name = "scp-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "scpctl"
path = "src/main.rs"

[dependencies]
scp-core = { path = "../scp-core" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
portable-pty = "0.8"
signal-hook = { version = "0.4", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
