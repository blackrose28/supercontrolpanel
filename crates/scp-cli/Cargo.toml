[package]
name = "scp-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "scpctl"
path = "src/main.rs"

[dependencies]
scp-core = { path = "../scp-core" }
scp-mcp = { path = "../scp-mcp", features = ["stdio"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
