[package]
name = "scp-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "scpctl"
path = "src/main.rs"

[dependencies]
scp-core = { path = "../scp-core" }
scp-mcp = { path = "../scp-mcp", features = ["stdio"] }
serde_json = "1"

[dev-dependencies]
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
