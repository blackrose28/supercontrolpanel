[package]
name = "scp-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
os-keyring = ["dep:keyring"]

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
# Match the desktop's persistent native stores, never keyring's fallback mock.
keyring = { version = "3", optional = true, features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }

[dev-dependencies]
anyhow = "1"
