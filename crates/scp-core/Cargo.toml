[package]
name = "scp-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5.3", features = ["zeroize"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-async-persistent", "async-io", "crypto-rust"] }
parking_lot = "0.12"
portable-pty = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
ssh2 = "0.9"
tempfile = "3"
totp-rs = "5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time"] }
