[package]
name = "scp-mcp-sdk-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Deliberately isolated from the core/CLI workspace and production desktop.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde_json = "1"
scp-core = { path = "../../crates/scp-core" }
tokio-util = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[dev-dependencies]
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process", "io-util"] }
